<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First Law</title>
  <meta name="description" content="A slide puzzle. Swipe, and you keep going until something stops you.">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: "Comfortaa";
      src: url("fonts/Comfortaa-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --wall: #E0E6F2;
      --floor: #120F1C;
      --text: #3A3550;
      --muted: #4A4560;
      --line: #C4CAD9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--wall);
      color: var(--floor);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 72px 16px 56px;
      text-align: center;
    }

    .icon {
      display: block;
      width: 128px;
      height: 128px;
      margin: 0 auto;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(18, 15, 28, 0.18);
    }

    h1 {
      margin: 24px 0 8px;
      font-family: "Comfortaa", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(40px, 7vw, 60px);
      line-height: 1.1;
    }

    .line {
      margin: 0 auto;
      max-width: 30rem;
      font-size: 20px;
      color: var(--text);
    }

    .store {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 14px;
      background: var(--floor);
      color: #FFFFFF;
      font-weight: 600;
    }

    .shots {
      margin: 56px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
    }

    .shots li {
      flex: 0 1 260px;
    }

    .shots img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(18, 15, 28, 0.14);
    }

    footer {
      border-top: 1px solid var(--line);
    }

    footer div {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 24px;
      font-size: 15px;
      color: var(--muted);
    }

    a {
      color: var(--floor);
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="img/icon.svg" width="128" height="128" alt="">
    <h1>First Law</h1>
    <p class="line">A slide puzzle. Swipe, and you keep going until something stops you.</p>
    <p class="store">Coming soon to Google Play</p>

    <ul class="shots">
      <li><img src="img/title.png" width="720" height="1480" alt="The title screen: a small room with a lever, a button, a puck and a door, under the words First Law"></li>
      <li><img src="img/easy.png" width="720" height="1480" alt="An early level: the player, a block, a button and its door, and the goal"></li>
      <li><img src="img/hard.png" width="720" height="1480" alt="A late level with a puck, a block, portals, a lever, phase walls, a door and a pit"></li>
    </ul>
  </main>

  <footer>
    <div>
      <span>© 2026 l1tbo</span>
      <a href="privacy/">Privacy policy</a>
      <a href="mailto:firstlawpuzzlegame@gmail.com">firstlawpuzzlegame@gmail.com</a>
    </div>
  </footer>
</body>
</html>
